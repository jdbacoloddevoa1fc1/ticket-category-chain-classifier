[project]
name = "ticket-category-chain-classifier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "langchain-openai>=0.2.0",
    "langchain-ollama>=0.2.0",
    "langchain-community>=0.4.2",
    "azure-identity>=1.15.0",
]

[project.scripts]
ticket-category-chain-classifier = "ticket_category_chain_classifier.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ticket_category_chain_classifier"]
